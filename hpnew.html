<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HP - Sambung ke laptop</title>
<style>
:root{--t:#e9f2e6;--m:#9db3a2;--a:#b9dc92;--l:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;color:var(--t);font:15px/1.5 system-ui,sans-serif;background:linear-gradient(135deg,#0b1913,#1b3a2c,#0d2018)}
h1,h2{font-family:Georgia,serif;font-weight:500}h1{font-size:1.6rem}h2{font-size:1.05rem}
.wrap{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 18px 40px}
.gl{background:rgba(255,255,255,.07);border:1px solid var(--l);border-radius:22px;padding:18px;margin-top:14px}
.m{color:var(--m);font-size:.88rem}
button{margin:12px 6px 0 0;padding:11px 18px;border:0;border-radius:30px;background:linear-gradient(90deg,#d4e9b5,#8fb878);color:#12261d;font:600 .9rem system-ui;cursor:pointer}
button.gh{background:none;border:1px solid var(--l);color:var(--t)}
button.red{background:linear-gradient(90deg,#ffb4b4,#e07a7a)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e07a7a;margin-right:8px}.dot.on{background:#7be08a;box-shadow:0 0 10px #7be08a}
#cam{position:relative;margin-top:12px;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1/1}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#cam::after{content:"";position:absolute;inset:18%;border:2px solid var(--a);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
#feed{max-height:320px;overflow:auto}
.msg{padding:10px 12px;margin-top:8px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--l)}
.msg small{color:var(--m)}.msg.u{border-color:#ff9b9b;background:rgba(255,80,80,.18)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sambung ke laptop</h1>

  <div class="gl" id="scan">
    <h2>Pindai QR dari laptop</h2>
    <p class="m" style="margin-top:6px" id="sh">Ketuk tombol di bawah, izinkan kamera, lalu arahkan ke QR di layar laptop.</p>
    <div id="cam" hidden><video id="v" playsinline muted></video></div>
    <button id="go">📷 Pindai QR</button><button class="gh" id="stop" hidden>Tutup kamera</button>
    <p class="m" id="se" style="margin-top:10px;color:#ffb4b4"></p>
  </div>

  <div id="ok" hidden>
    <div class="gl">
      <h2><span class="dot" id="dt"></span><span id="st">Menyambung...</span></h2>
      <p class="m" style="margin-top:6px">HP ini terdaftar sebagai <b id="nm" style="color:var(--a)"></b>. Biarkan halaman ini terbuka agar pesan dari laptop sampai.</p>
      <button class="red" id="al" hidden>🔕 Hentikan bunyi</button>
      <button id="ts">Tes</button><button class="gh" id="re">Pindai QR lain</button>
    </div>
    <div class="gl"><h2>Pesan masuk</h2><div id="feed"><p class="m">Belum ada pesan.</p></div></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=s=>document.querySelector(s),RT=/^hp-[0-9a-f]{32}$/,RR=/^lp-[0-9a-f]{32}$/;
let D=null,stream=null,raf=0,det=null,es=null,ac=null,rt=null,pg=null;

function baca(s){try{const u=new URL(s),t=u.searchParams.get('t'),r=u.searchParams.get('r')||'';
  if(RT.test(t))return{t,r:RR.test(r)?r:'',n:(u.searchParams.get('n')||'HP').slice(0,30)}}catch(e){}return null}

function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function beep(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.35)}
function stopRing(){clearInterval(rt);rt=null;$('#al').hidden=true}
function ring(){stopRing();$('#al').hidden=false;let n=0;const f=()=>{beep();navigator.vibrate&&navigator.vibrate([400,150,400]);if(++n>=30)stopRing()};f();rt=setInterval(f,800)}
$('#al').onclick=stopRing;document.addEventListener('click',unlock);

function tampil(m){
  const f=$('#feed');if(f.querySelector('p'))f.innerHTML='';
  const d=document.createElement('div');d.className='msg'+((m.priority||3)>=5?' u':'');
  const b=document.createElement('b'),p=document.createElement('div'),s=document.createElement('small');
  b.textContent=m.title||'Dari laptop';p.textContent=m.message||'';
  s.textContent=new Date((m.time||Date.now()/1000)*1000).toLocaleTimeString('id-ID');
  d.append(b,p,s);
  if(/^https?:\/\//i.test(m.click||'')){const a=document.createElement('a');a.href=m.click;a.target='_blank';a.rel='noopener';a.textContent=' 🔗 buka';a.style.color='var(--a)';p.append(a)}
  f.prepend(d);
  try{if(window.Notification&&Notification.permission==='granted')new Notification(b.textContent,{body:m.message||''})}catch(e){}
}
const status=(on,x)=>{$('#dt').className='dot'+(on?' on':'');$('#st').textContent=x};
function ping(){if(D&&D.r)fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify({topic:D.r,title:D.t,message:'ping'})}).catch(()=>{})}
function sambung(){
  if(es)es.close();status(false,'Menyambung...');
  es=new EventSource('https://ntfy.sh/'+D.t+'/sse?since='+Math.floor(Date.now()/1000));
  es.onopen=()=>{status(true,'Terhubung ke laptop');ping()};
  es.onerror=()=>status(false,'Terputus, mencoba lagi...');
  es.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.event!=='message')return;tampil(m);unlock();
    if((m.priority||3)>=5)ring();else{beep();navigator.vibrate&&navigator.vibrate(200)}};
  clearInterval(pg);pg=setInterval(ping,25000);
}
async function jaga(){try{await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(D&&document.visibilityState==='visible'){jaga();ping();if(!es||es.readyState===2)sambung()}});

function pakai(d){D=d;try{localStorage.setItem('hp-dev',JSON.stringify(d))}catch(e){}
  tutup();$('#scan').hidden=true;$('#ok').hidden=false;$('#nm').textContent=d.n;jaga();sambung()}
function tutup(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}
  $('#cam').hidden=true;$('#stop').hidden=true;$('#go').hidden=false}
async function mulai(){
  $('#se').textContent='';unlock();
  try{window.Notification&&Notification.permission==='default'&&await Notification.requestPermission()}catch(e){}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#se').textContent='Kamera tidak didukung. Buka lewat Chrome.';return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
  catch(e){$('#se').textContent='Izin kamera ditolak. Izinkan kamera untuk situs ini, lalu coba lagi.';return}
  const v=$('#v');v.srcObject=stream;await v.play();
  $('#cam').hidden=false;$('#stop').hidden=false;$('#go').hidden=true;$('#sh').textContent='Mencari QR...';
  if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const loop=async()=>{if(!stream)return;
    if(v.readyState>=2&&v.videoWidth){let k=null;
      if(det){try{const r=await det.detect(v);for(const c of r){k=baca(c.rawValue);if(k)break}}catch(e){}}
      if(!k&&window.jsQR){const w=Math.min(v.videoWidth,640),h=Math.round(w*v.videoHeight/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
        const r=jsQR(cx.getImageData(0,0,w,h).data,w,h);if(r)k=baca(r.data)}
      if(k){navigator.vibrate&&navigator.vibrate(60);pakai(k);return}}
    raf=requestAnimationFrame(loop)};
  loop()}
$('#go').onclick=mulai;
$('#stop').onclick=()=>{tutup();$('#sh').textContent='Ketuk tombol di bawah, izinkan kamera, lalu arahkan ke QR di layar laptop.'};
$('#re').onclick=()=>{if(es)es.close();clearInterval(pg);stopRing();$('#ok').hidden=true;$('#scan').hidden=false;mulai()};
$('#ts').onclick=()=>fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify({topic:D.t,title:'Tes',message:'Sambungan berhasil ✅'})}).catch(()=>{});

let k=baca(location.href);
if(!k){try{const j=JSON.parse(localStorage.getItem('hp-dev')||'null');if(j&&RT.test(j.t))k=j}catch(e){}}
if(k)pakai(k);
</script>
</body>
</html>
